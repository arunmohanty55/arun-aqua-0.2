name: Arun Aqua CI/CD

on:
  push:
    branches:
      - master

jobs:

  build-test-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Basic application test
      - name: Test application
        run: |
          python -m py_compile arun-aqua.py

      # 5. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/arun-aqua:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/arun-aqua:latest \
            .

      # 7. Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/arun-aqua:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/arun-aqua:latest

      # 8. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/arun-aqua:latest

            docker stop arun-aqua || true
            docker rm arun-aqua || true

            docker run -d \
              --name arun-aqua \
              -p 5000:5000 \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/arun-aqua:latest

            docker ps